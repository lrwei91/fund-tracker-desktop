name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (all Vitest suites)
        run: npm test
      - name: Watchlist split smoke test
        run: npm run smoke
      - name: Dependency audit
        run: npm audit --audit-level=high

  worker-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Worker bundle
        run: npm run worker:deploy:dry

  rust-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run frontend:prepare
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: JavaScript and Rust check
        run: npm run check
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

  package:
    strategy:
      matrix:
        include:
          - os: macos-14
            command: npm run build:mac:raw
            update-command: npm run build:update:mac
            artifact: mac
          - os: windows-latest
            command: npm run build:win:raw
            update-command: npm run build:update:win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          FUND_INTRADAY_SERVICE_URL: ${{ vars.FUND_INTRADAY_SERVICE_URL }}
        run: ${{ matrix.command }}
      - name: Package signed update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FUND_INTRADAY_SERVICE_URL: ${{ vars.FUND_INTRADAY_SERVICE_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing updater signing secret"; exit 1; }
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          ${{ matrix.update-command }}
      - name: Verify signed update artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATER_ARTIFACT_DIR: ${{ github.workspace }}/dist/updater
        run: cargo test --manifest-path src-tauri/Cargo.toml updater_signed_artifact_smoke -- --nocapture
      - name: Distribution size, runtime and checksum gate
        run: npm run size:check
      - name: Verify generated checksums
        run: npm run artifact:verify
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.evidence.json
            dist/updater/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, worker-quality, rust-quality, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: dist
          merge-multiple: true
      - name: Verify release checksums
        run: npm run artifact:verify
      - name: Generate complete updater manifest
        run: npm run update:manifest
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi
          if test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true"; then
            echo "Release already published; preserve immutable assets."
            exit 0
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > /tmp/fund-tracker-release-notes.txt
          UPDATE_NOTES_FILE=/tmp/fund-tracker-release-notes.txt npm run update:manifest
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 dist/*.evidence.json dist/updater/*.tar.gz dist/updater/*.exe dist/updater/*.sig dist/updater/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
