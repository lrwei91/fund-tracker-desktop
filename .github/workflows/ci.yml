name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Watchlist split smoke test
        run: npm run smoke
      - name: Refresh coordinator 50-code fixture smoke
        run: npm run smoke:refresh
      - name: Dependency audit
        run: npm audit --audit-level=high

  worker-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Collector unit tests
        run: npm run worker:test
      - name: Validate Worker bundle
        run: npm run worker:deploy:dry

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run frontend:prepare
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: JavaScript and Rust check
        run: npm run check
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Rust dependency audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

  package:
    strategy:
      matrix:
        include:
          - os: macos-14
            command: npm run build:mac:raw
            artifact: mac
          - os: windows-latest
            command: npm run build:win:raw
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Package
        env:
          FUND_INTRADAY_SERVICE_URL: ${{ vars.FUND_INTRADAY_SERVICE_URL }}
        run: ${{ matrix.command }}
      - name: Distribution size, runtime and checksum gate
        run: npm run size:check
      - name: Verify generated checksums
        run: npm run artifact:verify
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.evidence.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, worker-quality, rust-quality, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: dist
          merge-multiple: true
      - name: Verify release checksums
        run: npm run artifact:verify
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 dist/*.evidence.json --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
