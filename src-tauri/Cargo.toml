[package]
name = "fund-tracker"
version = "1.0.5"
description = "恭喜发财本地 Tauri 桌面应用"
edition = "2021"

[lib]
name = "fund_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fund-tracker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomicwrites = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
dirs = "6"
encoding_rs = "0.8"
futures = "0.3"
md-5 = "0.10"
open = "5"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "sync", "time"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
